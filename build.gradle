plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id 'base'
}

// 检查 libmpv 原生动态库
tasks.register('checkMpvNative') {
    group = 'mpv'
    description = '检查 mpv-2.dll 是否存在'
    doLast {
        def dll = file("common/src/client/resources/assets/ffcraft/natives/mpv-2.dll")
        if (dll.exists()) {
            logger.lifecycle('[mpv] ✅ mpv-2.dll 已就绪 ({} MB)', String.format("%.1f", dll.length() / 1048576.0))
        } else {
            logger.warn('[mpv] ⚠️  mpv-2.dll 未找到！')
            logger.warn('[mpv]   请下载并放置到: {}', dll.parentFile.absolutePath)
            logger.warn('[mpv]   下载页: https://sourceforge.net/projects/mpv-player-windows/files/libmpv/')
        }
    }
}

// ==========================================
// 一次性编译并打包所有版本的聚合任务
// ==========================================
tasks.register('buildAll') {
    group = 'build'
    description = '一次性编译并输出所有 Minecraft 版本的成品 Jar 包'
    dependsOn subprojects.collect { "${it.path}:assemble" }

    doLast {
        def outDir = file("${layout.buildDirectory.get().asFile}/libs")
        outDir.mkdirs()
        subprojects.each { sub ->
            def subLibsDir = sub.layout.buildDirectory.dir("libs").get().asFile
            if (subLibsDir.exists()) {
                subLibsDir.listFiles()?.each { f ->
                    if (f.name.endsWith('.jar') && !f.name.endsWith('-sources.jar') && !f.name.endsWith('-dev.jar')) {
                        copy {
                            from f
                            into outDir
                        }
                        logger.lifecycle("[BuildAll] 成功收集成品 Jar: ${f.name} -> ${outDir.name}/")
                    }
                }
            }
        }
    }
}

// 将根项目的 assemble 和 build 任务挂钩到 buildAll
tasks.named('assemble') {
    dependsOn 'buildAll'
}

tasks.named('build') {
    dependsOn 'buildAll'
}
